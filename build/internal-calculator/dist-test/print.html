<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Click Graphics — Internal Calculator</title>
  <style>
    /* GT Pressura, self-hosted. Replaces Space Grotesk from Google Fonts: that
       call sent every staff member's IP to Google on each page load, and the
       rest of the estate is already free of third-party fonts.
       Files live in public/fonts/ and are emitted next to this page. The url()
       is RELATIVE on purpose, so the same build works at /calculator/ or at a
       parallel path like /calculator-test/ without touching vite's `base`.
       Only 400/700 plus italics ship — the UI asks for 500 and 600, which CSS
       maps onto 400 and 700 rather than synthesising a weight. */
    @font-face{font-family:'GT Pressura';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/gt-pressura-400.woff2) format('woff2')}
    @font-face{font-family:'GT Pressura';font-style:italic;font-weight:400;font-display:swap;src:url(fonts/gt-pressura-400-italic.woff2) format('woff2')}
    @font-face{font-family:'GT Pressura';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/gt-pressura-700.woff2) format('woff2')}
    @font-face{font-family:'GT Pressura';font-style:italic;font-weight:700;font-display:swap;src:url(fonts/gt-pressura-700-italic.woff2) format('woff2')}
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #fef3ea; }
    body { font-family: 'GT Pressura', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 500; -webkit-font-smoothing: antialiased; color: #0a0a0a; }
    #root { min-height: 100vh; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
  </style>
  <script type="module" crossorigin src="/calculator-test/print.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
