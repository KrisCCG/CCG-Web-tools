<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Click Graphics</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px 24px;
    }

    .logo {
      width: min(320px, 80vw);
      height: auto;
      margin-bottom: 48px;
    }

    .divider {
      width: 48px;
      height: 4px;
      background: #3D00FF;
      margin-bottom: 32px;
    }

    h1 {
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 700;
      color: #0a0a0a;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      text-align: center;
    }

    p {
      font-size: 15px;
      color: #666;
      text-align: center;
      line-height: 1.6;
      max-width: 360px;
      margin-bottom: 40px;
    }

    .contact {
      font-size: 14px;
      color: #999;
      text-align: center;
      line-height: 2;
    }

    .contact a {
      color: #3D00FF;
      text-decoration: none;
      font-weight: 600;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    .badge {
      margin-top: 48px;
      font-size: 11px;
      color: #ccc;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <img src="Logo.jpg" alt="Click Click Graphics" class="logo" />

  <div class="divider"></div>

  <h1>Something new is coming</h1>
  <p>Our new website is under construction. In the meantime, feel free to reach out directly.</p>

  <div class="contact">
    <a href="mailto:info@clickclickgraphics.com">info@clickclickgraphics.com</a><br>
    +32 2 880 70 36<br>
    Aalststraat 7-11, 1000 Brussels
  </div>

  <div class="badge">Brussels · Print · Since forever</div>

</body>
</html>
