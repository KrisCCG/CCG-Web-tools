<?xml version="1.0" encoding="UTF-8"?>
<svg id="Calque_1" data-name="Calque 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 167.22 221.99">
  <defs>
    <style>
      .cls-2 { fill: #4200ff; }

      @keyframes shake {
        0%, 18%, 100% { transform: translateX(0) rotate(0deg); }
        2%  { transform: translateX(-3px) rotate(-2deg); }
        4%  { transform: translateX(3px) rotate(2deg); }
        6%  { transform: translateX(-3px) rotate(-1.5deg); }
        8%  { transform: translateX(3px) rotate(1.5deg); }
        10% { transform: translateX(-2px) rotate(-1deg); }
        12% { transform: translateX(2px) rotate(1deg); }
        14% { transform: translateX(-1px) rotate(-0.5deg); }
        16% { transform: translateX(0) rotate(0deg); }
      }

      /* Pause par défaut */
      .excl-1 {
        animation: shake 3s ease-in-out infinite;
        animation-play-state: paused;
        transform-origin: 57px 111px;
      }
      .excl-2 {
        animation: shake 3s ease-in-out infinite;
        animation-delay: 0.08s;
        animation-play-state: paused;
        transform-origin: 107px 111px;
      }

      /* Lance au survol du SVG */
      svg:hover .excl-1,
      svg:hover .excl-2 {
        animation-play-state: running;
      }
    </style>
  </defs>
