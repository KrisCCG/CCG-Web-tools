<style>
/* One LET'S TALK button (chat bubbles) */
.cc-btnrow { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:flex-start; }
.cc-btnrow .cc-btn { display:block; flex:0 1 200px; width:200px; max-width:100%; }

/* Button colours and hover (same effect as before) */
.cc-btn-svg .fond-beige { fill:#fce4d4; transition:fill .35s ease; }
.cc-btn-svg .contour-bleu { fill:#4200ff; transition:fill .35s ease; }
.cc-btn-svg .texte { fill:#fce4d4; transition:fill .35s ease; }
.cc-btn-svg .icone { fill:#4200ff; transition:fill .35s ease; }
.cc-btn:hover .fond-beige { fill:#4200ff; }
.cc-btn:hover .contour-bleu { fill:#fce4d4; }
.cc-btn:hover .texte { fill:#4200ff; }
.cc-btn:hover .icone { fill:#fce4d4; }
.cc-btn-svg .panier-fixe { opacity:1; transform:translateX(0); transition:opacity .35s ease, transform .35s ease; }
.cc-btn:hover .panier-fixe { opacity:0; transform:translateX(-30px); }
.cc-btn-svg .fleche-anim { opacity:0; transform:translateX(30px); transition:opacity .35s ease, transform .35s ease; }
.cc-btn:hover .fleche-anim { opacity:1; transform:translateX(0); }
</style>
