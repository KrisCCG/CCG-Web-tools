    body {

      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      font-family: sans-serif;
    }
    .btn-wrapper {
      cursor: pointer;
      width: 90vw;
      max-width: 100%;
    }
  </style>

      <defs>
        <style>
          /* Color transitions */
          .fond-beige { fill: #fce4d4; transition: fill 0.35s ease; }
          .contour-bleu { fill: #4200ff; transition: fill 0.35s ease; }
          .texte { fill: #fce4d4; transition: fill 0.35s ease; }
          .icone { fill: #4200ff; transition: fill 0.35s ease; }

          /* Hover: invert colors */
          #bouton007:hover .fond-beige { fill: #4200ff; }
          #bouton007:hover .contour-bleu { fill: #fce4d4; }
          #bouton007:hover .texte { fill: #4200ff; }
          #bouton007:hover .icone { fill: #fce4d4; }

          /* Basket: starts visible at center, slides left on hover */
          #panier-fixe {
            opacity: 1;
            transform: translateX(0);
            transition: opacity 0.35s ease, transform 0.35s ease;
          }
          #bouton007:hover #panier-fixe {
            opacity: 0;
            transform: translateX(-30px);
          }

          /* Arrow: starts off-screen right, slides to center on hover */
          #fleche-anim {
            opacity: 0;
            transform: translateX(30px);
            transition: opacity 0.35s ease, transform 0.35s ease;
          }
          #bouton007:hover #fleche-anim {
            opacity: 1;
            transform: translateX(0);
          }
        </style>
