  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"font-size:11px;color:#9A9287;font-weight:600;\">order qty<\u002Fdiv>\n                    <div style=\"font-weight:700;font-size:17px;\">{{ it.standardOrderAmount }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <button onclick=\"{{ it.onMarkOrder }}\" style=\"padding:10px 16px;border:2px solid #0A0A0A;background:#3211FC;color:#FEF3EA;border-radius:999px;font-size:14px;font-weight:700;\">Mark ordered<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasOnOrder }}\" hint-placeholder-val=\"{{ false }}\">\n          <h3 style=\"font-weight:700;font-size:22px;margin:30px 0 14px;color:#FEF3EA;letter-spacing:-0.01em;\">On order<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:12px;\">\n            <sc-for list=\"{{ onOrderItems }}\" as=\"it\" hint-placeholder-count=\"1\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:14px 18px;background:#FEF3EA;border:2px solid #0A0A0A;border-radius:14px;box-shadow:4px 4px 0 #0A0A0A;flex-wrap:wrap;color:#0A0A0A;\">\n                <div style=\"flex:1;min-width:150px;\">\n                  <div style=\"font-weight:700;font-size:15px;\">{{ it.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#6C645B;margin-top:2px;font-weight:500;\">{{ it.onOrderQty }} sheets · ordered {{ it.lastOrderFmt }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1.5px solid #0A0A0A;background:#F6B73C;color:#0A0A0A;font-size:12px;font-weight:700;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#E0871A;border:1px solid #0A0A0A;\"><\u002Fspan>awaiting delivery<\u002Fspan>\n                <button onclick=\"{{ it.onReceiveOrder }}\" style=\"padding:10px 16px;border:2px solid #0A0A0A;background:#19A26E;color:#FEF3EA;border-radius:999px;font-size:14px;font-weight:700;\">Receive<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ OFFER CHECK ============ -->\n    <sc-if value=\"{{ viewOffer }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:880px;margin:0 auto;\">\n        <h2 style=\"font-weight:700;font-size:clamp(26px,5vw,38px);margin:0 0 6px;letter-spacing:-0.02em;color:#FEF3EA;\">Can we deliver this offer?<\u002Fh2>\n        <p style=\"margin:0 0 22px;color:rgba(254,243,234,0.85);font-size:15px;font-weight:500;\">Add the papers a job needs (in cut-to-size sheets) and see what's covered from stock right now.<\u002Fp>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px;\">\n          <sc-for list=\"{{ offerLines }}\" as=\"line\" hint-placeholder-count=\"2\">\n            <div style=\"background:#FEF3EA;border:2px solid #0A0A0A;border-radius:16px;box-shadow:4px 4px 0 #0A0A0A;padding:16px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;color:#0A0A0A;\">\n              <div style=\"flex:2;min-width:180px;\">\n                <label style=\"font-size:11px;color:#6C645B;display:block;margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;\">Paper<\u002Flabel>\n                <div style=\"position:relative;\">\n                  <input value=\"{{ line.queryVal }}\" onchange=\"{{ line.onQuery }}\" onfocus=\"{{ line.onFocus }}\" placeholder=\"Type paper name — e.g. bi, biotop 300\" style=\"position:relative;z-index:47;width:100%;padding:11px 12px;border:2px solid #0A0A0A;border-radius:10px;background:#F7E9DC;color:#0A0A0A;font-size:14px;font-weight:600;\">\n                  <sc-if value=\"{{ line.showSuggest }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div onclick=\"{{ line.onClosePicker }}\" style=\"position:fixed;inset:0;z-index:45;\"><\u002Fdiv>\n                    <d ss=\"ps-sug-h\">Pick one — or keep typing<\u002Fdiv>\n              <sc-for list=\"{{ draftSupSuggest }}\" as=\"sg\" hint-placeholder-count=\"3\">\n                <button class=\"ps-sug-i\" onmousedown=\"{{ sg.pick }}\">{{ sg.name }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Flabel>\n        <label style=\"font-size:11px;color:#6C645B;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;\">Order number<input value=\"{{ draft.orderNumber }}\" onchange=\"{{ onDraftOrderNo }}\" style=\"display:block;margin-top:6px;width:100%;padding:11px 12px;border:2px solid #0A0A0A;border-radius:10px;background:#F7E9DC;color:#0A0A0A;font-size:14px;font-weight:600;\"><\u002Flabel>\n        <label style=\"font-size:11px;color:#6C645B;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;\">Stock (sheets)<input inputmode=\"numeric\" value=\"{{ draft.stock }}\" onchange=\"{{ onDraftStock }}\" style=\"display:block;margin-top:6px;width:100%;padding:11px 12px;border:2px solid #0A0A0A;border-radius:10px;background:#F7E9DC;color:#0A0A0A;font-size:14px;font-weight:600;\"><\u002Flabel>\n        <label style=\"font-size:11px;color:#6C645B;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;\">Minimum stock<input inputmode=\"numeric\" value=\"{{ draft.minStock }}\" onchange=\"{{ onDraftMin }}\" style=\"display:block;margin-top:6px;width:100%;padding:11px 12px;border:2px solid #0A0A0A;border-radius:10px;background:#F7E9DC;color:#0A0A0A;font-size:14px;font-weight:600;\"><\u002Flabel>\n        <label style=\"font-size:11px;color:#6C645B;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;\">Order qty<input inputmode=\"numeric\" value=\"{{ draft.standardOrderAmount }}\" onchange=\"{{ onDraftStd }}\" style=\"display:block;margin-top:6px;width:100%;padding:11px 12px;border:2px solid #0A0A0A;border-radius:10px;background:#F7E9DC;color:#0A0A0A;font-size:14px;font-weight:600;\"><\u002Flabel>\n        <label style=\"font-size:11px;color:#6C645B;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;\">Cut-to-size per sheet<input inputmode=\"numeric\" value=\"{{ draft.yield }}\" onchange=\"{{ onDraftYield }}\" style=\"display:block;margin-top:6px;width:100%;padding:11px 12px;border:2px solid #0A0A0A;border-radius:10px;background:#F7E9DC;color:#0A0A0A;font-size:14px;font-weight:600;\"><\u002Flabel>\n        <div style=\"grid-column:1 \u002F -1;font-size:12px;color:#6C645B;font-weight:500;line-height:1.45;background:#F7E9DC;border:1.5px solid #E6D6C3;border-radius:10px;padding:10px 12px;\">GSM = paper weight (g\u002Fm²). Grain = fibre direction (SG short, LG long). Cut-to-size per sheet = how many usable sheets you get from one original sheet — e.g. a 640 × 450 original cut down to 320 × 450 gives 2.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;margin-top:22px;\">\n        <button onclick=\"{{ onAddCancel }}\" style=\"flex:1;padding:13px;border:2px solid #0A0A0A;background:#FEF3EA;color:#0A0A0A;border-radius:999px;font-size:14px;font-weight:700;\">Cancel<\u002Fbutton>\n        <button onclick=\"{{ onAddSave }}\" style=\"flex:2;padding:13px;border:2px solid #0A0A0A;background:#3211FC;color:#FEF3EA;border-radius:999px;font-size:14px;font-weight:700;box-shadow:3px 3px 0 #0A0A0A;\">{{ draftSaveLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  KEY = 'paperstock_v5';\n\n  state = {\n    papers: [], offer: [], view: 'stock', search: '', sup: 'all', stat: 'all', density: 'list',\n    inp: {}, expanded: null, actId: null, showAdd: false, editId: null, draft: this.blankDraft(),\n    adminUnlocked: false, adminPw: '', adminErr: false, adminSearch: '', openPicker: null, pickerQuery: '', supOpen: false, draftSupOpen: false, draftFmtOpen: false, draftNameOpen: false,\n    w: (typeof window !== 'undefined' ? window.innerWidth : 1200), loaded: false,\n  };\n\n  blankDraft() {\n    return { name:'', colour:'natural', gsm:'', supplierFormat:'', grade:'SG', supplier:'',\n      orderNumber:'', stock:'', minStock:'', standardOrderAmount:'', yield:'1' };\n  }\n  today() { return new Date().toISOString().slice(0, 10); }\n  fmt(iso) {\n    if (!iso) return '\\u2014';\n    const d = new Date(iso); if (isNaN(d)) return String(iso);\n    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });\n  }\n  num(v) { const n = Math.round(parseFloat(v)); return isFinite(n) ? n : 0; }\n  cap(s) { s = (s == null ? '' : String(s)).trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }\n\n  componentDidMount() {\n    this._onR = () => this.setState({ w: window.innerWidth });\n    window.addEventListener('resize', this._onR);\n    this._load();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onR);\n    clearTimeout(this._t);\n  }\n\n  \u002F* ============================================================\n     DATA LAYER  —  swap point for Infomaniak VPS\n     Replace the two bodies below with calls to your own API and\n     every workflow keeps working unchanged.\n     ============================================================ *\u002F\n  async _load() {\n    let data = null;\n    try {\n      const r = await fetch('api\u002Fstate.php', { cache: 'no-store' });\n      if (r.ok) data = await r.json();\n    } catch (e) {}\n    if (!data) { try { data = JSON.parse(localStorage.getItem(this.KEY)); } catch (e) {} }\n    if (data && data.papers && data.papers.length) {\n      this.setState({ papers: data.papers, offer: data.offer || [], loaded: true });\n    } else {\n      this.setState({ papers: this.seed(), loaded: true }, () => this._persist());\n    }\n  }\n  _persist() {\n    clearTimeout(this._t);\n    this._t = setTimeout(() => {\n      const payload = { v: 2, papers: this.state.papers, offer: this.state.offer };\n      try { localStorage.setItem(this.KEY, JSON.stringify(payload)); } catch (e) {}\n      try {\n        fetch('api\u002Fstate.php', { method: 'POST', headers: { 'Content-Type': 'application\u002Fjson' }, body: JSON.stringify(payload) });\n      } catch (e) {}\n    }, 400);\n  }\n  _set(papers, cb) { this.setState({ papers }, () => { this._persist(); cb && cb(); }); }\n  \u002F* ============================================================ *\u002F\n\n  sheetsYield(size) {\n    const m = String(size).match(\u002F(\\d+)\\D+(\\d+)\u002F);\n    if (!m) return 1;\n    const W = +m[1], H = +m[2];\n    const a = Math.floor(W \u002F 320) * Math.floor(H \u002F 450), b = Math.floor(W \u002F 450) * Math.floor(H \u002F 320);\n    return Math.max(1, a, b);\n  }\n  seed() {\n    \u002F\u002F name, colour, gsm, size, grain, stock, order#, std order, supplier, min, last order date\n    const D = [\n      ['Biotop','natural',80,'450 × 320','SG',1500,'88100304',1000,'Papyrus',500,''],\n      ['Biotop','natural',90,'450 × 320','SG',2000,'88100315',1000,'Papyrus',500,''],\n      ['Biotop','natural',100,'460 × 320','LG',600,'',1000,'Papyrus',500,''],\n      ['Biotop','natural',120,'450 × 320','SG',1150,'88100329',1000,'Papyrus',1000,''],\n      ['Biotop','natural',120,'460 × 320','LG',4500,'',1000,'Igepa',250,''],\n      ['Biotop','natural',160,'450 × 320','SG',2750,'88100336',1000,'Papyrus',500,''],\n      ['Biotop','natural',250,'450 × 320','SG',1325,'88100349',1000,'Papyrus',500,''],\n      ['Biotop','natural',300,'450 × 320','SG',1000,'88218127',1000,'Papyrus',500,''],\n      ['RecyStar','natural',90,'450 × 320','LG',500,'',1000,'Papyrus',500,''],\n      ['RecyStar','natural',115,'450 × 640','LG',1500,'88288455',1000,'Papyrus',500,''],\n      ['RecyStar','natural',135,'450 × 640','LG',1000,'88288465',1000,'Papyrus',500,''],\n      ['RecyStar','natural',170,'450 × 640','LG',1500,'88288495',1000,'Papyrus',1000,''],\n      ['RecyStar','natural',250,'450 × 320','LG',1750,'88367518',1000,'Papyrus',500,''],\n      ['RecyStar','natural',300,'450 × 320','LG',750,'88367519',1000,'Papyrus',500,''],\n      ['MultiArt','White',115,'460 × 640','LG',4000,'88309470',4000,'Papyrus',500,''],\n      ['MultiArt','White',115,'640 × 460','SG',100,'88309723',4000,'Papyrus',500,''],\n      ['MultiArt','White',130,'460 × 640','LG',4000,'88309477',4000,'Papyrus',500,''],\n      ['MultiArt','White',130,'640 × 460','SG',4000,'88309736',4000,'Papyrus',500,''],\n      ['MultiArt','White',170,'460 × 640','LG',7000,'88311124',4000,'Papyrus',500,''],\n      ['MultiArt','White',170,'640 × 460','SG',4000,'88311126',4000,'Papyrus',500,''],\n      ['MultiArt','White',250,'460 × 640','LG',1000,'88310450',4000,'Papyrus',500,''],\n      ['MultiArt','White',250,'640 × 460','SG',3800,'88309795',4000,'Papyrus',500,''],\n      ['MultiArt','White',300,'460 × 640','LG',1000,'88310465',2000,'Papyrus',500,''],\n      ['MultiArt','White',350,'460 × 640','LG',2000,'88309989',2000,'Papyrus',500,''],\n      ['MultiArt','White',400,'460 × 640','LG',4000,'88310492',2000,'Papyrus',500,''],\n      ['Arena Rough','natural',120,'1020 × 720','SG',500,'1WSx1221',0,'Fedrigoni',0,'2025-05-30'],\n      ['Arena Rough','natural',120,'720 × 1020','LG',350,'',0,'Fedrigoni',0,''],\n      ['Arena Rough','natural',140,'1020 × 720','SG',225,'',0,'Fedrigoni',0,''],\n      ['Arena Rough','natural',140,'720 × 1020','LG',200,'',0,'Fedrigoni',0,''],\n      ['Arena Rough','natural',300,'1020 × 720','SG',40,'',0,'Fedrigoni',0,''],\n      ['Arena Rough','natural',300,'720 × 1020','LG',75,'',0,'Fedrigoni',0,''],\n      ['Arena Rough Bulk','natural',120,'640 × 900','LG',40,'',0,'Fedrigoni',0,''],\n      ['Arena Smooth','White',250,'720 × 1020','LG',50,'',0,'Fedrigoni',0,''],\n      ['Arena Smooth','White',300,'720 × 1020','LG',80,'',0,'Fedrigoni',0,''],\n      ['Arena Rough','White',140,'720 × 1020','LG',100,'',0,'Fedrigoni',0,''],\n      ['Arena Rough','natural',100,'720 × 1020','LG',30,'',0,'Fedrigoni',0,''],\n      ['Arena Smooth','natural',300,'640 × 900','LG',40,'',0,'Fedrigoni',0,''],\n      ['Woodstock','natural',285,'700 × 1000','LG',250,'',0,'Fedrigoni',0,''],\n      ['Free Vellum White','White',100,'700 × 1000','LG',4000,'',0,'Fedrigoni',0,''],\n      ['Biotop','natural',120,'650 × 920','LG',125,'',0,'Papyrus',0,''],\n      ['Sirio White','White',700,'720 × 1020','LG',100,'',0,'Fedrigoni',0,''],\n      ['Multioffset','White',300,'450 × 640','LG',200,'',0,'Fedrigoni',0,''],\n      ['Arena Rough','Ivory',120,'640 × 900','LG',100,'1IR12050',250,'Fedrigoni',0,''],\n      ['Old Mill','Bianco',190,'700 × 1000','LG',50,'10001916',125,'Fedrigoni',0,''],\n      ['Cotton Pure','Blanc',300,'570 × 730','LG',70,'40303',100,'Pelletier',25,''],\n      ['Woodstock','Cipria',285,'700 × 1000','LG',250,'10027651',125,'Fedrigoni',0,''],\n      ['Lessebo Design 1.3','Ivory',440,'320 × 450','SG',400,'01-0200-3790',100,'Igepa',0,''],\n      ['MultiDesign orginal','White',300,'450 × 320','SG',600,'88261463',300,'Papyrus',0,''],\n      ['Splendorlux 1 digital','Premium White',300,'450 × 320','SG',500,'1005025',200,'Fedrigoni',0,''],\n      ['Vergé','Crème',280,'700 × 1000','LG',100,'',100,'Pelletier',0,''],\n      ['MultiDesign Original','White',300,'1020 × 720','SG',75,'88261460',75,'Papyrus',0,''],\n      ['Symbol Freelife Satin P.W.','Premium White',350,'700 × 1000','LG',100,'10632935',100,'Fedrigoni',0,''],\n      ['Splendorgel Avorio','Avorio',85,'710 × 1000','LG',500,'10071572',250,'Fedrigoni',0,''],\n      ['Matrica','Kraft',120,'720 × 1020','LG',400,'10027873',200,'Fedrigoni',0,''],\n      ['Constellation Snow','E.34 Fiandra',350,'720 × 1020','LG',100,'10763534',100,'Fedrigoni',0,''],\n    ];\n    return D.map((r, i) => ({\n      id: 'p' + (i + 1), name: r[0], colour: r[1], gsm: r[2], supplierFormat: r[3], grade: r[4],\n      stock: r[5], orderNumber: String(r[6] || '\\u2014'), standardOrderAmount: r[7], supplier: r[8],\n      minStock: r[9], lastOrderDate: r[10], yield
