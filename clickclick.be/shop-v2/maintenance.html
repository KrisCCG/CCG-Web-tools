:root{--blue:#4200ff;--ink:#1a0066;--cream:#fff5ef}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"GT Pressura",system-ui,sans-serif}
main{min-height:100vh;display:flex;align-items:center;max-width:1380px;margin:0 auto;padding:clamp(32px,6vw,80px) clamp(30px,5vw,50px)}
.wrap{width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,5vw,72px);align-items:center}
.art{position:relative;width:fit-content;margin:0 auto}
.logo{height:clamp(220px,34vw,420px);width:auto;display:block}
.mag .steam path{animation:steam 2.4s ease-in-out infinite}
.mag .steam path:nth-child(2){animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.mag .steam path{animation:none}}
@media (max-width:781px){.mag{right:-48%}}
.kicker{font-family:"GT Pressura Mono",ui-monospace,monospace;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:0}
.titlerow{display:flex;align-items:center;gap:clamp(16px,2.4vw,28px);margin:.3em 0 .4em}
.titlerow h1{margin:0}
.nona{flex:none;display:block;width:clamp(96px,11vw,150px);text-decoration:none;color:var(--blue);transform:rotate(4deg);transition:transform .2s}
.nona:hover{transform:rotate(0) scale(1.04)}
.nona img{display:block;width:100%;aspect-ratio:1;object-fit:cover;object-position:62% 86%;border-radius:14px;box-shadow:0 0 0 5px #fff5ef}
.nona .lbl{display:block;margin-top:.5em;font-family:"GT Pressura Mono",ui-monospace,monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;text-align:center;font-weight:400}
h1{font-weight:700;font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.05;margin:.3em 0 .4em}
p.text{font-size:clamp(1.1rem,1.6vw,1.35rem);line-height:1.45;margin:0 0 1.6rem;max-width:34ch}
.mail{font-family:"GT Pressura Mono",ui-monospace,monospace;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;margin:0}
.mail a{color:var(--blue)}
.langs{margin-top:2.2rem;font-family:"GT Pressura Mono",ui-monospace,monospace;font-size:.82rem;letter-spacing:.1em}
.langs button{background:none;border:0;padding:0 .2em;font:inherit;color:var(--ink);cursor:pointer;opacity:.55}
.langs button.on{color:var(--blue);opacity:1;text-decoration:underline;text-underline-offset:3px}
[data-l]{display:none}
html[lang=en] [data-l=en],html[lang=fr] [data-l=fr],html[lang=nl] [data-l=nl]{display:revert}
@media (max-width:781px){.wrap{grid-template-columns:1fr}.logo{height:200px}}
</style>
