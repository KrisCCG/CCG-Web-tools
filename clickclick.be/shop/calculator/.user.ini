; PHP-FPM per-directory configuration (Infomaniak uses PHP-FPM, so .htaccess
; php_value directives are ignored — these settings apply via .user.ini instead).
; Cached for 5 minutes; first request after upload may still see old limits.

upload_max_filesize = 100M
post_max_size       = 110M
max_execution_time  = 300
max_input_time      = 300
memory_limit        = 128M
